- year: 2026
  date: "2026-09-07"
  type: Presentation
  topics: [Open Source, Research Software, AI]
  peer_reviewed: true
  title: "Using Local VLMs for Data Extraction"
  citation: |-
    Richard Littauer (2026). Using Local VLMs for Data Extraction. *Aotearoa New Zealand Research Software Conference (NZRS 2026)*, 7 Sep 2026. Online.
  abstract: |-
    Global LLMs are readily available for research software engineering work, and researchers with a limited budget can easily use web interfaces to do complex tasks. However, most LLM providers are international corporations which can ignore or sidestep regional regulations or ethical concerns around sensitive data usage. For some RSEs, this blocks the usage of LLMs for development work. In this presentation, I will discuss why I used open source LLMs with open weights on a local grid provided by my institution to extract data from 65 years worth of PDFs from academic journals published in Aotearoa New Zealand. I focus on five main points that affect RSE work and researchers in Aotearoa New Zealand: Te Tiriti, funds, licensing, copyright, and reproducibility.
  doi: 10.5281/zenodo.22559441
  pdf:
  bib: /publications/bib/Littauer2026UsingLocal.bib
  slides: https://github.com/RichardLitt/talks/blob/main/2026.09.07%20NZRS%202026%20Using%20Local%20VLMs%20for%20Data%20Extraction.pdf

- year: 2026
  date: "2026-02-12"
  type: [Journal Article, Short Note]
  topics: [Ornithology, Community Science, Bioacoustics]
  peer_reviewed: true
  title: "Community-science sourced evidence of vocal mimicry in Perisoreus jays"
  citation: |-
    Richard Littauer, Sam Darmstadt, William M. Kirsch & Davyd H. Betchkal (2026). Community-science sourced evidence of vocal mimicry in *Perisoreus* jays. *The Wilson Journal of Ornithology* 138(3): 504–514.
  abstract: |-
    Avian vocal mimicry is a well-documented behavior in passerines. However, for many species, detailed data on the diversity of mimicry behavior remains scarce. Additionally, it is unclear whether closely related species exhibit similar mimicry behaviors. One group of mimics is the *Perisoreus* jays: the Canada Jay (*P. canadensis*), Siberian Jay (*P. infaustus*), and Sichuan Jay (*P. internigrans*). To characterize mimicry behavior in this genus, we conducted a systematic analysis of over 450,000 community-sourced observations of *Perisoreus* jays from eBird, Macaulay Library, iNaturalist, and Xeno-Canto. We found a total of 244 observations of mimicry for species in this genus and identified 40 model species mimicked by the Canada Jay (31 of which were not documented previously), 20 model species mimicked by the Siberian Jay (16 of which were not documented previously), and no model species mimicked by the Sichuan Jay (although two were documented previously), alongside 121 recordings of mimicry events. Our findings suggest that vocal mimicry in *Perisoreus* jays is more extensive and diverse than previously documented. This study highlights the value of community science data in documenting rare or understudied behaviors and calls for further research on the significance of vocal mimicry, particularly among closely related species.
  doi: 10.1080/15594491.2026.2616578
  pdf: /publications/Littauer2026CommunityScience.pdf
  bib: /publications/bib/Littauer2026CommunityScience.bib

- year: 2026
  date: "2026-08-10"
  type: [Journal Article, Full Paper]
  topics: [Community Science, Open Source, Open Data, OSS Policy, Research Software]
  peer_reviewed: true
  title: "Open practices across science, software, education and other domains"
  citation: |-
    John Meluso, Cassandra Chambers, Richard Littauer, Nerea Llamas, Elizabeth Long Lingo, Marlene Mhangami, Beck Pitt, Violetta Splitter, Huajin Wang (2026). Open practices across science, software, education and other domains. *Nature Human Behaviour*: 1–13.
  abstract: |-
    Open practices are actions people perform to influence transparency (who can see information), inclusion (who can voice perspectives) and decision rights (who can make decisions). Open practices have grown popular across domains, including open science, open-source software and open education, in hopes of spurring innovation and broadening participation. But which open practices best enable groups and organizations to achieve these ambitious goals, and why? This Perspective distils seven successful practices from across these domains that can help groups to define goals, allocate power, share information and set norms. These practices, such as documenting power structures and adopting a code of conduct, hold potential to support groups and organizations seeking to address great challenges through openness. However, delivering on that potential will depend on how well groups share lessons across domains, tailor these practices and sustain the people and platforms that carry them.
  doi: 10.1038/s41562-026-02526-0
  preprint: https://doi.org/10.2139/ssrn.4821969
  pdf: https://www.nature.com/articles/s41562-026-02526-0.pdf
  bib: /publications/bib/Meluso2026NHB.bib

- year: 2026
  date: "2026-08-17"
  type: Presentation
  topics: [Ornithology, Bioacoustics, AI]
  peer_reviewed: true
  title: "Large-scale NLP detection of vocal mimicry in Australian community science bird observations"
  citation: |-
    Richard Littauer (2026). Large-scale NLP detection of vocal mimicry in Australian community science bird observations. *World Ecoacoustics Congress 2026 Abstract Booklet*, p. 58. 17–20 Aug 2026, Cairns / Gimuy, Australia.
  abstract: |-
    Introduction. Avian vocal mimicry is well documented for Australia's birds. However, studies normally focus on individual species or genera. Community science platforms such as eBird present an opportunity to crowd-source text comments mentioning mimicry at scale. Here, we present a natural language processing (NLP) approach for mining mimicry-related observations from the Australian eBird dataset, based on the methods from Littauer et al. (2026).

    Methods. We developed a basic regex detection system applied to species-level and checklist comments from the entire Australian eBird dataset (69 million rows. We used a core bucket of terms unambiguously describing vocal mimicry (using the terms "mimic" and "imitate") and a larger bucket of broader acoustic similarity language (e.g. "sounds like," "reminiscent of"). To reduce false positives for species totals, checklist-level matches were excluded, and manual validation was performed for all core-tier observations from species with <10 occurrences.

    Results. We identified 6,864 observations referencing mimicry across 689 species. Restricting to the validated core bucket yielded 2,312 confirmed mimicry observations from 111 species. The most frequently documented mimics were: Superb Lyrebird *Menura novaehollandiae* (579 observations), European Starling *Sturnus vulgaris* (220), Olive-backed Oriole *Oriolus sagittatus* (200), Singing Bushlark *Mirafra javanica* (142), Spangled Drongo *Dicrurus bracteatus* (92). Observations with the highest densities were in New South Wales, Victoria, and Queensland.

    Conclusions. These results demonstrate that NLP-based mining of community science text can recover substantial behavioural signal from unstructured observer notes. Future work will focus on cleaning the data, building species relation matrices, and characterising model species. This study highlights both the promise and the validation challenges inherent in large-scale behavioural data mining from community science platforms.
  doi: 10.5281/zenodo.22169692
  pdf:
  bib: /publications/bib/Littauer2026WEC.bib
  slides: https://github.com/RichardLitt/talks/blob/main/2026.08.17%20World%20Ecoacoustics%20Congress%202026%20Large-scale%20NLP%20detection%20of%20vocal%20mimicry%20in%20Australian%20community%20science%20bird%20observations.pdf

