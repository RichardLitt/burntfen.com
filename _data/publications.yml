  topics: [Research Software, OSS Policy]
  peer_reviewed: false
  title: "2nd International Research Software Funders Workshop Summary"
  citation: |-
    Rena Bakhshi, Michelle Barker, Ishwar Chandramouliswaran, Neil Chue Hong, Carole Goble, Brian Corrie, Fares Dhane, Christopher Erdmann, Richard Gunn, Kim Hartley, Daniel S. Katz, Fabio Kon, Mark Leggott, Richard Littauer, JB Poline, Malvika Sharan, Andrew Treloar, Qian Zhang, Shurui Zhou (2024). 2nd International Research Software Funders Workshop Summary. Zenodo.
  abstract: |-
    This report summarizes the 2nd International Research Software Funders Workshop, including its discussions and suggestions. From September 18-20, 2023, the Digital Research Alliance of Canada (the Alliance) and the Research Software Alliance (ReSA) co-convened this hybrid workshop, which brought together 50 representatives from more than 35 organizations from across the globe – including funders and organizations that support research software – to collaborate in Montreal, Canada, and online.

    People are at the heart of research software sustainability and funders can lead the way by investing in the people who develop and maintain research software. That is why the workshop theme was “Investing in People: Anticipating the Future of Research Software”. The event aimed to set the future agenda for government, philanthropic, and industry funders to support sustainable research software and communities.

    During the three-day workshop, experts explored how research software funders can facilitate capacity building through funder practices; research software platforms, infrastructure, and communities; and new initiatives. Moreover, Version 1.0 of the Amsterdam Declaration on Funding Research Software Sustainability (ADORE.software) was released and is now available for signing. The recommendations in ADORE.software informed the structure of the workshop’s breakout sessions, with a focus on research software practice; research software ecosystem; research software personnel; and research software ethics.
