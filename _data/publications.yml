  citation: |-
    Richard Littauer (2024). *Prunum boreale* (A. E. Verrill, 1884) is changed to *P. borealis*. *Codex Mutabilis*, 4 Dec 2024.
  abstract: |-
    [*Prunum boreale* (A. E. Verrill, 1884)](https://www.marinespecies.org/aphia.php?p=taxdetails&id=160011) was made available as *Marginella borealis*, A. E. Verrill 1884. *Borealis* is only an adjective in Classical Latin, but it was substantivized as a noun in Medieval Latin, according to the [Mittellateinisches Wörterbuch](https://mlat.uzh.ch/dictionaries). The ICZN notes in the [Glossary](https://code.iczn.org/formation-and-treatment-of-names/article-30-gender-of-genus-group-names?frame=1) that Latin “includes both ancient and mediaeval Latin”. Verrill did not make any statement indicating that *borealis* was to be considered as an adjective or a noun, nor that it was derived from a non-Latin or non-Greek word. According to ICZN 31.2.2, the species name must be considered as a noun in apposition to the genus, and the original spelling is to be retained.

    *Prunum borealis* (A. E. Verrill, 1884) is the correct name.
  doi: 10.5281/zenodo.14377607
  url: https://codexmutabilis.com/substantive/2024/12/04/prunum-boreale-a-e-verrill-1884-p-borealis.html
