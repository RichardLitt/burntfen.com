- year: 2025
  date: "2025-10-27"
  type: Report
  topics: [Community Science, Open Source, Research Software]
  peer_reviewed: false
  title: "Mapping the Open Source Ecosystem for Climate Science and Sustainable Technology"
  citation: |-
    Richard Littauer, Tobias Augspurger, Alex Stinson, Pierre J. C. Vogler-Finck, Andrew Nesbitt, Chris Harris (2025). Mapping the Open Source Ecosystem for Climate Science and Sustainable Technology (1.0). Zenodo.
  abstract: |-
    The climate crisis poses a severe threat to the natural systems that support modern civilization, disrupting essential cycles that provide freshwater, fertile soils, and stable weather patterns. These disruptions are projected to lead to widespread biodiversity loss and to upset local and global economies. To ensure that the scientific basis of these projections is transparent and credible, researchers globally are increasingly making climate data and models openly available following best practices from the open science, software, and data communities. This openness supports informed decision-making and helps safeguard sustainable development from being compromised by short-term political or economic agendas.

    Despite this progress in open science, the broader application of open source software and open data in climate and sustainability-related technologies remains limited. National governments, international organizations, academia, industry, and civil society have all played roles in both contributing to the crisis and proposing solutions. However, fragmented, proprietary approaches persist. Open source offers a powerful alternative: lowering costs, enhancing verifiability, and enabling collaboration across disciplines and sectors.

    In this paper, we introduce OpenSustain.tech, the most comprehensive dataset of over 2,500 open source projects directly addressing the climate crisis. We detail the transparent methodology used to curate this collection, including human expert review across multiple fields. We further analyze the network of transitive dependencies among these projects, extending previous work in mapping the climate-focused open source ecosystem.

    Finally, we discuss the strategic importance of open source in advancing climate solutions, including its potential economic and societal value. By building shared digital infrastructure, we argue that open source can play a foundational role in climate mitigation, adaptation, and sustainable development.
  doi: 10.5281/zenodo.17459415
  pdf: /publications/Littauer2025MappingOpen2.pdf
  bib: /publications/bib/Littauer2025MappingOpenZenodo.bib

- year: 2025
  date: "2025-09-09"
  type: Presentation
  topics: [Research Software]
  peer_reviewed: true
  title: "Quick tips for making your software outlive your job"
  citation: |-
    Richard Littauer, Ian McInerney, Clare Dillon, Daniel S. Katz (2025). Quick tips for making your software outlive your job. *RSE Conference 2025 (RSECon25)*, 9 Sep 2025, Warwick, UK.
  abstract: |-
    Loss of key personnel has always been a risk for research software projects. Key members of a team may have to step away due to a change in national or university funding, due to illness or burnout, or because they are simply changing jobs. Today, political and financial changes are putting large numbers of researchers out of work simultaneously, both in the UK and abroad, potentially leaving large amounts of research software abandoned and destabilising necessary digital research infrastructure. We present ten tips to help researchers ensure that the software they have built will continue to be usable after they have left their present job, for any reason. These techniques, methods, and best practices were collectively sourced from researchers from dozens of universities across the globe, and are now being improved upon in a ReSA Task Force. The tips shown here will enable individual researchers and labs to position their work in a way that makes it more sustainable and usable going forward, resulting in a more resilient research software ecosystem.
  doi: 10.5281/zenodo.17968168
