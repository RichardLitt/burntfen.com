- year: 2012
  type: [Journal Article, Full Paper]
  topics: [Linguistics, Open Source, Language Evolution]
  peer_reviewed: true
  title: "Replicating Oliphant's Saussurean Simulations"
  citation: |-
    Richard Littauer (2012). Replicating Oliphant's Saussurean Simulations. *Début: The Undergraduate Journal of Languages, Linguistics, and Area Studies* 3(1).
  abstract: |-
    "A Saussurean communication system exists when an entire communicating population uses a single language that maps states unambiguously onto symbols and then back into the original states" (Oliphant 1996: 31) Oliphant constructed simulations in order to illuminate the conditions necessary for the evolution and maintenance of such Saussurean systems. I replicate his first two simulations that involved direct pressure for good transmission. I go on to produce a third, novel simulation, which looks at gradations of reward for successful communication, in order to ensure that the first two simulations are not guilty of begging the question. I then further describe the benefits of communication to the sender and the receiver in evolutionary game theory, theoretically discussing reciprocal altruism and spatial organisation. Finally, I explore some theories involving indirect pressure on transmission, which would explain the generation and maintenance of optimal Saussurean communication systems.
  doi: 10.5281/zenodo.22169033
