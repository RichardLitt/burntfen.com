# Publications and other research outputs, newest first.
# Rendered by _projects/publications-list.md.
#
# Fields:
#   year, type, topics   - `type` (one type or a list) and each topic become filter tags
#   peer_reviewed        - true adds the "Peer Reviewed" tag, which is on by default
#   status               - optional: "In Review" or "In Press"; becomes a tag. In-review
#                          entries use `year: In Review` and sit at the top.
#   title                - plain text, no markdown; used in the "email me" subject line
#   citation             - authors (year). title. venue. No links; those go below.
#   doi                  - bare DOI, e.g. 10.11646/zootaxa.5792.1.12
#   url                  - landing page, when there's no DOI or it adds something
#   pdf, bib             - paths under /publications/ or full URLs. Entries with no pdf
#                          and no Zenodo/arXiv DOI get an "email me" link instead
#                          (papers only; not talks, posters, software, data, edited volumes or popular articles).
#   slides, recording    - optional
# Leave doi/pdf/bib empty rather than deleting them, so gaps are easy to spot.

