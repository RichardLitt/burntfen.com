- year: 2022
  date: "2022-08-06"
  type: Conference Paper
  topics: [Linguistics]
  peer_reviewed: true
  title: "On Tocharian Exceptionality to the centum-satem Isogloss"
  citation: |-
    Richard Littauer (2022). On Tocharian Exceptionality to the *centum-satem* Isogloss. In: C. Wilson, ed., *Undergraduate Linguistics Association of Britain 2012 Proceedings*, pp. 18–25. Bristol, UK: online.
  abstract: |-
    I argue that there may have been pressures inhibiting phonological change in Tocharian, particularly in relation to the centum/satem Indo-European split. Firstly, if the overall complexity of language strata may change over time (Sampson, 2009), syntactic, morphological, and lexical changes may have inhibited a change in the phonemic inventory of the language. Secondly, I examine the historical evidence for other languages in historical Central Asia in order to show that contact languages may have also horizontally influenced the centum nature of Tocharian. Thirdly, I posit that the merge of the PIE dorsal consonants may have been influenced by the decline in the general use, domain, and range of Tocharian, which would be in line with recent research correlating small phonemic inventories with small language communities (Hay & Bauer, 2007). Tocharian therefore may not have been susceptible to a weak dialect wave, or to a possible early branching of IE. This paper takes a new perspective on the history and development of Tocharian, and in turn on the nature of the ‘textbook’ isogloss example.
  doi: 10.5281/zenodo.6969558
  pdf: /publications/Littauer2022TocharianExceptionality.pdf
  bib: /publications/bib/Littauer2022TocharianExceptionality.bib

