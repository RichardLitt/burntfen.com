- year: 2025
  date: "2025-06"
  type: [Journal Article, Full Paper]
  topics: [Ornithology, Literary Studies]
  peer_reviewed: true
  title: "The Sooty Shearwater as Melville’s Inscrutable Haglet"
  citation: |-
    Richard Littauer (2025). The Sooty Shearwater as Melville’s Inscrutable Haglet. *Leviathan: The Journal of Melville Studies* 27(2): 90–101.
  abstract: |-
    Herman Melville’s poem “The Haglets” concerns a doomed ship visited by three, eerie birds. The specific identity of the birds is unclear. Previous research has identified the birds as either Great Shearwaters (*Puffinus gravis*), or simply generic shearwaters. Below, I cover the historical use of the word haglet. I argue that the Sooty Shearwater (*Ardenna grisea*) is the bird that Melville most likely had in mind when writing the poem, based on its range, color, vocalizations, Melville’s experience with pelagic birds, and the implications of the English and Latin names for this bird.
  doi: 10.1353/lvn.2025.a970199
  pdf:
  bib: /publications/bib/Littauer2025Melville.bib

