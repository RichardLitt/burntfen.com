- year: 2026
  date: "2026-10-16"
  type: [Journal Article, Short Note]
  topics: [Taxonomic Nomenclature, Invertebrates]
  peer_reviewed: false
  title: "Porrhomma boreale (Banks, 1899) is changed to P. borealis"
  citation: |-
    Richard Littauer (2026). *Porrhomma boreale* (Banks, 1899) is changed to *P. borealis*. *Codex Mutabilis*, 16 Oct 2026.
  abstract: |-
    [*Porrhomma boreale* (Banks, 1899)](https://wsc.nmbe.ch/species/17349) was made available as *Gongylidium borealis*, Banks 1899. *Borealis* is only an adjective in Classical Latin, but it was substantivized as a noun in Medieval Latin, according to the [Mittellateinisches Wörterbuch](https://mlat.uzh.ch/dictionaries). The ICZN notes in the [Glossary](https://code.iczn.org/formation-and-treatment-of-names/article-30-gender-of-genus-group-names?frame=1) that Latin “includes both ancient and mediaeval Latin”. Banks did not make any statement indicating that *borealis* was to be considered as an adjective or a noun, nor that it was derived from a non-Latin or non-Greek word. According to ICZN 31.2.2, the species name must be considered as a noun in apposition to the genus, and the original spelling is to be retained.

    *Porrhomma borealis* (Banks, 1899) is the correct name.
  doi: 10.5281/zenodo.23413292
  url: https://codexmutabilis.com/substantive/2024/12/05/porrhomma-boreale-banks-1899-is-changed-to-p-borealis.html
  pdf:
  bib: /publications/bib/Littauer2026PorrhommaBoreale.bib

