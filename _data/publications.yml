- year: 2026
  date: "2026-02-10"
  type: [Conference Paper, Presentation]
  topics: [Community Science, Research Software, Open Source]
  peer_reviewed: true
  title: "Mapping the Open Source Ecosystem for Climate Science and Sustainable Technology"
  citation: |-
    Richard Littauer (2026). Mapping the Open Source Ecosystem for Climate Science and Sustainable Technology. In: R. Littauer, D. Ganesan, eds., *Kiwi PyCon 2025 Academic Track Proceedings*, pp. 4–5.
  abstract: |-
    The climate crisis poses a severe threat to the natural systems that support modern civilization, disrupting essential cycles that provide freshwater, fertile soils, and stable weather patterns. These disruptions are projected to lead to widespread biodiversity loss and to upset local and global economies (IPBES 2019). To ensure that the scientific basis of these projections is transparent and credible, researchers globally are increasingly making climate data and models openly available. This openness supports informed decision-making and helps safeguard sustainable development from being compromised by short-term political or economic agendas.

    Despite this progress in open science, the broader application of open source software and open data in climate and sustainability-related technologies remains limited. National governments, international organizations, academia, industry, and civil society have all played roles in both contributing to the crisis and proposing solutions. However, fragmented, proprietary approaches persist. Open source offers a powerful alternative—lowering costs, enhancing verifiability, and enabling collaboration across disciplines and sectors.

    In this talk, I'll introduce OpenSustain.tech, the most comprehensive dataset of over 2,500 open source projects directly addressing the climate crisis (Augspurger et al. 2023). I'll detail the transparent methodology used to curate this collection, including human expert review across multiple fields, and talk a bit about the network of transitive dependencies among these projects, extending previous work in mapping the climate-focused open source ecosystem.

    I'll talk about which projects are written in Python, and discuss which projects seem to be most relevant to the climate crisis. Finally, I'll discuss the strategic importance of open source and Python in advancing climate solutions.
