  title: "Crowd sourcing the classroom: Interactive applications in higher learning"
  citation: |-
    Richard Littauer, Antonia Scheidel, Marc Schulder, Sibel Ciddi (2012). Crowd sourcing the classroom: Interactive applications in higher learning. In: L. Gómez Chova, I. Candel Torres, A. López Martínez, eds., *Proceedings of the 4th International Conference on Education and New Learning Technologies (EDULEARN12)*, pp. 1473–1481, Barcelona, Spain. International Association of Technology, Education and Development (IATED).
  abstract: |-
    The traditional university classroom paradigm frequently leads to fragmented knowledge dispersal; each student creates, collates, and curates their own notes individually. Here, we present a more holistic approach to student participation, based on experience from a student-initiated experiment using interactive applications in higher education. We explore several methods to help university students work collaboratively: Simultaneous note-taking using an online, interactive notepad; centralised information storage using a dedicated wiki; student-run centralised storage in the cloud; and communication management using a dedicated email list. In this paper, we elaborate on these points, and draw upon relevant previous literature, as well as our experience with implementing this system in several classes with diverse subjects in a graduate level Computational Linguistics degree. We also suggest future avenues to explore, such as slide-and-note integration.
  doi:
  pdf: /publications/Littauer2012CrowdSourcing.pdf
  bib: /publications/bib/Littauer2012CrowdSourcing.bib

- year: 2012
  date: "2012-05-01"
  type: Conference Paper
  topics: [Linguistics, Open Source]
  peer_reviewed: true
  title: "Using Clojure in Linguistic Computing"
  citation: |-
    Zoltán Varjú, Richard Littauer, Peteris Erins (2012). Using Clojure in Linguistic Computing. *Proceedings of ELS 2012: 5th European Lisp Symposium*, Zadar, Croatia, 30 Apr–1 May 2012.
  abstract: |-
    Due to recent developments in the humanities and the social sciences more and more scholars are turning towards computing. Although there are accessible and well designed toolkits to get into computing, taking the step from surface knowledge of programming to tackling non-trivial issues is difficult and time intensive. Even those researchers with some computing background may face problems when they want to deepen their knowledge and start serious projects, especially when participating with a team of programmers is not an option. We think using Clojure for linguistic computing answers these concerns. Here, we examine the existing resources and explain why Clojure can help in both educating and researching. We also present two mini case studies as examples of Clojure’s interoperability and use.
  doi:
  pdf: /publications/Varju2012UsingClojure.pdf
  bib: /publications/bib/Varju2012UsingClojure.bib

