- year: 2026
  date: "2026-10-13"
  type: [Journal Article, Short Note]
  topics: [Ornithology, Taxonomic Nomenclature]
  peer_reviewed: true
  title: "Neotype designation for Red-winged Blackbird (Agelaius phoeniceus)"
  citation: |-
    Richard Littauer (2026). Neotype designation for Red-winged Blackbird (*Agelaius phoeniceus*). *The Wilson Journal of Ornithology*.
  abstract: |-
    Mearns (1911) and Howell and Van Rossem (1928) attempted to restrict the type locality of the Red-winged Blackbird *Agelaius phoeniceus* (Linnaeus, 1766) and the nominate subspecies to Charleston, South Carolina, USA, using Mearns’ (1911) unfounded statement that Linnaeus based his description only on M. Catesby’s work. A taxon’s type locality can only be the location where the syntypes were described or collected. Linnaeus referenced other authors than Catesby in his original description, resulting in a much broader type locality, covering the range of multiple currently recognized subspecies. No valid designation of a lectotype or neotype was made by Mearns (1911) or Howell and Van Rossem (1928), or any later author. No known syntypes of *A. phoeniceus* are extant. In order to promote stability in the nomenclature, I designate a neotype for *Agelaius phoeniceus*, collected originally by E. Mearns in 1911 in Charleston, South Carolina, and now stored at Smithsonian Institution, National Museum of Natural History.
  doi: 10.1080/15594491.2026.2737543
  pdf: https://www.tandfonline.com/doi/pdf/10.1080/15594491.2026.2737543
  bib: /publications/bib/Littauer2026NeotypeDesignation.bib

- year: 2026
  date: "2026-10-08"
  type: [Journal Article, Full Paper]
  topics: [Ornithology, Taxonomic Nomenclature]
  peer_reviewed: true
  title: "No agreement required: a further note on kākāpō Strigops nomenclature"
  citation: |-
    Richard Littauer (2026). No agreement required: a further note on kākāpō *Strigops* nomenclature. *Notornis* 73(4): 315–320.
  abstract: |-
    The kākāpō *Strigops habroptilus* Gray, 1845 has a complicated nomenclatural history. This paper sheds light on the correct spelling of three specific names in the genus, and the gender of the generic name, as interpreted through the International Code of Zoological Nomenclature. In short: *Strigops* Gray, 1845 is feminine, as ruled by the Commission in Declaration 26; *Strigops habroptilus* Gray, 1845 and *Strigops insulaborealis* Worthy et al., 2026 are the correct spellings of the specific names, as nouns in apposition, through Article 31.2 and also through the application of the Glossary; and *Strigops habroptilus innominata* Mathews & Iredale, 1913 is the correct spelling of that currently unrecognised name. An updated entry for each taxon for the Checklist of the birds of New Zealand is also provided.
  doi: 10.63172/051543jdlmdl
  pdf: https://www.birdsnz.org.nz/wp-content/uploads/2026/10/Littauer_734_315-320.pdf
  bib: /publications/bib/Littauer2026NoAgreement.bib

- year: 2026
  date: "2026-10-08"
  type: [Journal Article, Short Note]
  topics: [Ornithology]
  peer_reviewed: true
  title: "Subspecific identity of channel-billed cuckoos (Scythrops novaehollandiae) vagrant to Aotearoa New Zealand"
  citation: |-
    Richard Littauer (2026). Subspecific identity of channel-billed cuckoos (*Scythrops novaehollandiae*) vagrant to Aotearoa New Zealand. *Notornis* 73(4): 327–331.
  abstract: |-
    The channel-billed cuckoo *Scythrops novaehollandiae* is an occasional vagrant to Aotearoa New Zealand, with eight confirmed records. There are three described subspecies: the nominate form from Australia; *S. n. fordi* from Sulawesi; and *S. n. schoddei* from the Bismarck Archipelago. No previous studies have identified the subspecific identity of any channel-billed cuckoos in New Zealand. I compare published measurements with my own measurements of museum specimens, and conclude that two of the New Zealand vagrant specimens are identifiable as the Australian subspecies, *S. n. novaehollandiae* (as expected, given geographical proximity), while other records are indeterminate. I suggest that this name be added to the official Checklist. I also briefly present some incidental nomenclatural comments for this species.
  doi: 10.63172/397288zycfgk
  pdf: https://www.birdsnz.org.nz/wp-content/uploads/2026/10/Littauer_734_327-331.pdf
  bib: /publications/bib/Littauer2026SubspecificIdentity.bib

