# Sends each new _daily/ entry to the email list, Bluesky and Mastodon once it is
# live on the site.
#
# Do not use "Re-run jobs" on this workflow: it would send to everyone again, so
# the script refuses. To retry a channel that failed, use "Run workflow" and name
# only that channel.
name: Publish daily log

on:
  push:
    branches: ["main"]
    paths: ["_daily/**"]
  workflow_dispatch:
    inputs:
      entry:
        description: "Entry to send, e.g. _daily/2026-11-08-a-title.md"
        required: true
      channels:
        description: "Comma-separated: email, bluesky, mastodon"
        required: true
        default: "email,bluesky,mastodon"
      test_to:
        description: "Email only this address, and skip the list and social posts"
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Send new entries
        run: node .github/scripts/publish-daily.mjs
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          ENTRY: ${{ inputs.entry }}
          CHANNELS: ${{ inputs.channels }}
          TEST_TO: ${{ inputs.test_to }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
